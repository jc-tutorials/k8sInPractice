# The routing rules. Traefik (already running in k3s) enforces them.
# No host is set, so this matches any hostname - which is why
# http://localhost:8088 simply works.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
