# A three-node k3s cluster inside Docker.
#   k3d cluster create --config k3d-config.yaml
#
# k3s already ships Traefik (so Ingress works) and metrics-server (so the
# HorizontalPodAutoscaler works). Nothing extra to install.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: exchange
servers: 1
agents: 2
ports:
  # your laptop's 8088  ->  the cluster's ingress on port 80
  - port: 8088:80
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # Kubernetes deletes images no pod is using once the disk is 85% full, and our
      # image is imported, not pulled - once deleted, pods land in ImagePullBackOff.
      # Laptops are often that full, so only clear images above 95%.
      - arg: --kubelet-arg=image-gc-high-threshold=95
        nodeFilters: [server:*, agent:*]
      - arg: --kubelet-arg=image-gc-low-threshold=90
        nodeFilters: [server:*, agent:*]
