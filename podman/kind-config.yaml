# Fallback for anyone who cannot run k3d (or is on Podman rather than Docker).
# Unlike k3s, kind ships neither an ingress controller nor metrics-server, so
# scripts/setup-kind-extras.sh installs both. Prefer k3d if you can.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: exchange
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
  - role: worker
  - role: worker
